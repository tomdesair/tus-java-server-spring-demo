# ==============================================================================
# Tus Java Server Spring Boot Demo - Application Configuration
# ==============================================================================

# Active Spring Profile
spring.profiles.active=dev

# Server Port (Spring Boot embedded Tomcat runs on http://localhost:8080)
server.port=8080

# Maximum Allowed Upload Size (in bytes across all endpoints, default: 1 GB = 1073741824 bytes)
tus.server.max-upload-size=1073741824

# ==============================================================================
# 1. DISK STORAGE BACKEND CONFIGURATION
#    Test Page:       http://localhost:8080/test/
#    Upload Endpoint: /test/api/upload
# ==============================================================================
# Directory path on local file system or mounted network drive (NFS/EFS/SMB)
# where uploaded chunks, completed files, and lease locks are stored.
# Uses DiskStorageService and LeaseFileLockingService.
tus.server.data.directory=${java.io.tmpdir}/tus

# ==============================================================================
# 2. S3-COMPATIBLE STORAGE BACKEND CONFIGURATION
#    Test Page:       http://localhost:8080/test-s3/
#    Upload Endpoint: /test-s3/api/upload
# ==============================================================================
# Endpoint URL of the S3-compatible service.
# - Local MinIO emulator: http://localhost:9000
# - AWS S3:               https://s3.us-east-1.amazonaws.com (or region specific)
# - Cloudflare R2 / Ceph: https://<account_id>.r2.cloudflarestorage.com
tus.s3.endpoint=http://localhost:9000

# Target S3 bucket name where files and lock lease objects are stored.
# NOTE: The bucket must already exist on your S3 / MinIO server before uploading.
tus.s3.bucket-name=tus-uploads

# S3 Access Key ID (e.g. MinIO root username "minioadmin" or AWS Access Key ID).
tus.s3.access-key=minioadmin

# S3 Secret Access Key (e.g. MinIO root password "minioadmin" or AWS Secret Access Key).
tus.s3.secret-key=minioadmin

# S3 Region (Optional, defaults to us-east-1 if omitted).
tus.s3.region=us-east-1

# ==============================================================================
# 3. AZURE BLOB STORAGE BACKEND CONFIGURATION
#    Test Page:       http://localhost:8080/test-azure/
#    Upload Endpoint: /test-azure/api/upload
# ==============================================================================
# Azure Storage Connection String.
# - Azurite local emulator: Use the well-known development connection string:
#   DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
# - Azure Cloud: Obtain from Azure Portal -> Storage Account -> Security + networking -> Access keys -> Connection string
tus.azure.connection-string=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;

# Target Azure Blob container name where uploaded block blobs and leases are stored.
# NOTE: The container must already exist in your Azure Storage account or Azurite emulator before uploading.
tus.azure.container-name=tus-uploads